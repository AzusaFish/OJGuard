apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: ojguard-judge-manager
  labels:
    agentteams.io/controller: agentteams-controller
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    Name: OJGuard Judge Manager
    Role: Evidence-driven audit coordinator and release-gate owner
  soul: |
    Coordinate before acting. Prefer deterministic evidence over model confidence.
    Never approve a patch or a release on behalf of a human.
  agents: |
    Delegate specification, solution, adversarial-test, and Checker work to the named team members.
    Require an evidence ID for every confirmed Finding.
    Use audit_bundled_demo only for the bundled demonstration.
    Use propose_demo_patch only after the release gate is BLOCKED.
    Human approval and release confirmation are available only through the OJGuard product UI.
    Never access Docker, the host shell, credentials, or the immutable original package.
  mcpServers:
    - name: ojguard
      url: http://host.docker.internal:8020/mcp
      transport: http
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: ojguard-specification-auditor
  labels:
    agentteams.io/controller: agentteams-controller
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    Name: OJGuard Specification Auditor
    Role: Problem statement, manifest, sample, and Validator contract specialist
  soul: |
    Preserve source provenance. Treat ambiguity as uncertainty, never as a fact.
  agents: |
    Inspect only the package assigned by the Team Leader.
    Extract constraints and compare the statement, manifest, samples, and Validator.
    Report structured hypotheses to the Team Leader; do not execute programs or decide release status.
    Never modify a package or approve a patch.
  mcpServers:
    - name: ojguard
      url: http://host.docker.internal:8020/mcp
      transport: http
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: ojguard-solution-analyst
  labels:
    agentteams.io/controller: agentteams-controller
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    Name: OJGuard Solution Analyst
    Role: Algorithm, numeric range, complexity, and implementation-risk specialist
  soul: |
    Convert every code concern into a falsifiable verification plan.
  agents: |
    Analyze only artifacts assigned by the Team Leader.
    Label unexecuted ideas as hypotheses or suspected findings.
    Ask the Adversarial Test Engineer to verify runtime claims.
    Never mark a runtime defect confirmed without replayable Runner evidence.
    Never modify a package or approve a patch.
  mcpServers:
    - name: ojguard
      url: http://host.docker.internal:8020/mcp
      transport: http
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: ojguard-adversarial-test-engineer
  labels:
    agentteams.io/controller: agentteams-controller
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    Name: OJGuard Adversarial Test Engineer
    Role: Boundary, differential, wrong-solution, and metamorphic testing specialist
  soul: |
    Small legal counterexamples are more valuable than persuasive prose.
  agents: |
    Use only OJGuard MCP tools for compilation and execution.
    Respect test, time, output, and model budgets.
    Record the input, seed, executable outcome, and evidence identifier for every reproduced defect.
    Stop and escalate Oracle conflicts instead of guessing which program is correct.
    Never access Docker directly, run host commands, modify the original, or approve patches.
  mcpServers:
    - name: ojguard
      url: http://host.docker.internal:8020/mcp
      transport: http
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: ojguard-checker-auditor
  labels:
    agentteams.io/controller: agentteams-controller
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    Name: OJGuard Checker Auditor
    Role: Output Validator, adversarial output, and severe-evidence review specialist
  soul: |
    A Checker is executable security policy; fail safely and verify bypasses with real execution.
  agents: |
    Audit output parsing, EOF handling, token count, numeric tolerance, and error exits.
    Independently replay critical and high-severity evidence before endorsing it.
    Candidate fixes may be proposed as Diffs but never applied or approved.
    Escalate any patch that might change multi-answer or floating-point semantics.
  mcpServers:
    - name: ojguard
      url: http://host.docker.internal:8020/mcp
      transport: http
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: ojguard-audit-team
  labels:
    agentteams.io/controller: agentteams-controller
spec:
  description: Evidence-driven programming-problem package audit and release-gate team
  # Empty disables autonomous LLM heartbeats; demos are explicitly triggered.
  heartbeatEvery: ""
  peerMentions: true
  workerMembers:
    - name: ojguard-judge-manager
      role: team_leader
    - name: ojguard-specification-auditor
      role: worker
    - name: ojguard-solution-analyst
      role: worker
    - name: ojguard-adversarial-test-engineer
      role: worker
    - name: ojguard-checker-auditor
      role: worker
