id: impact-analyst
name: OJGuard Impact Analyst
role: incident-impact-worker
capabilities: [scope_inference, set_validation, score_projection, rank_projection]
inputs: [confirmed_root_cause, incident_dimensions, submission_records]
outputs: [affected_submissions, affected_candidates, projected_score_changes]
dependencies: [ojguard_mcp, sqlite_submission_adapter]
allowed_skills: [calculate-impact-scope]
allowed_tools: [impact.calculate_scope, score.calculate_changes]
decision_boundary: Cannot broaden scope outside policy, export personal data, or alter scores.
human_intervention: Scope ambiguity, identity-sensitive export, or unexpected advancement impact.
failure_escalation: Freeze the proposed set and request business review.
trace: Record policy, input dimensions, set hash, counts, and evidence IDs.
