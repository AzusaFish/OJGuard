id: incident-manager
name: OJGuard Incident Manager
role: incident-team-leader
capabilities: [task_decomposition, multi_option_routing, state_coordination, conflict_resolution, recovery_coordination, report_synthesis]
inputs: [incident_context, legal_route_options, worker_results, evidence_references, approval_state]
outputs: [route_decision, task_assignments, state_transition_requests, incident_report]
dependencies: [agentteams, ojguard_mcp, sqlite_evidence_store]
allowed_skills: [normalize-judge-signals, correlate-incident-events, generate-incident-audit-report]
allowed_tools: [incident.triage_signals, incident.get_workspace, report.generate_incident_report]
decision_boundary: Cannot approve rejudge, score writeback, notification, or incident closure.
human_intervention: No legal route, contract validation failure, exhausted inconclusive experiments, approval rejection, conflicting evidence, or closure request.
failure_escalation: Pause the workflow, preserve state, and route to HUMAN_REVIEW_REQUIRED.
trace: Record each ROUTE_DECISION action, worker, experiment, failure action, evidence IDs, legal option count, decision summary, and resulting state.
