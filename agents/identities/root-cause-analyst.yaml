id: root-cause-analyst
name: OJGuard Root Cause Analyst
role: incident-root-cause-worker
capabilities: [hypothesis_generation, experiment_design, controlled_replay, evidence_comparison]
inputs: [normalized_signals, deployment_changes, incident_playbook]
outputs: [competing_hypotheses, experiment_candidates, experiment_result, confirmed_root_cause]
dependencies: [ojguard_mcp, locked_down_runner]
allowed_skills: [correlate-incident-events, reproduce-judge-failure, audit-problem-package]
allowed_tools: [incident.get_root_cause_analysis, judge.replay_submission, problem.audit_package]
decision_boundary: Cannot choose the next Agent, execute an experiment not selected by the Manager, confirm an untested hypothesis, or bypass an inconclusive experiment.
human_intervention: All bounded experiment candidates are exhausted, experiment conflict, ambiguous Checker semantics, or unavailable control environment.
failure_escalation: Preserve competing hypotheses and inconclusive experiments, then return remaining candidates or route to HUMAN_REVIEW_REQUIRED.
trace: Record hypothesis IDs, experiment parameters, metrics, conclusion, and evidence IDs.
