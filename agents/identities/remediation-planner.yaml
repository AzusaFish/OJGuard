id: remediation-planner
name: OJGuard Remediation Planner
role: incident-remediation-worker
capabilities: [rollback_planning, isolation_planning, rejudge_planning, recovery_plan_versioning, stop_condition_design]
inputs: [confirmed_root_cause, approved_impact_scope, failed_canary, previous_plan, playbook]
outputs: [remediation_plan, recovery_plan_revision, approval_requests, rollback_points]
dependencies: [ojguard_mcp]
allowed_skills: [generate-remediation-plan]
allowed_tools: [rejudge.create_plan, incident.get_approvals]
decision_boundary: Cannot self-approve, execute a batch, mutate the frozen impact set, or rewrite a failed canary as successful.
human_intervention: Every L2+ action, score writeback, notification, and closure.
failure_escalation: Keep the incident at PAUSED or APPROVAL_PENDING with explicit missing decisions and the failed batch reference.
trace: Record plan ID, revision, superseded plan/batch IDs, preconditions, checks, stop conditions, risks, and requested approvals.
