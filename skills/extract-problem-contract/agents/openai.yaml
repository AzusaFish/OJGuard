interface:
  display_name: "Extract Problem Contract"
  short_description: "Extract sourced constraints and report conflicts safely"
  default_prompt: "Use $extract-problem-contract to derive a sourced contract from this problem package."
dependencies:
  tools:
    - type: "mcp"
      value: "ojguard"
      description: "OJGuard artifact and contract tools"
      transport: "streamable_http"
      url: "http://ojguard-mcp:8020/mcp"
