<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
    <rect width="100%" height="100%" rx="24" fill="#F7F9FC"/>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1B1F3B}
      .h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:600}.b{font-size:19px}.s{font-size:16px;fill:#526074}
      .card{fill:#FFFFFF;stroke:#D8E0EC;stroke-width:2}.navy{fill:#0B1F3A}.orange{fill:#FF6B35}.green{fill:#0AA37F}.blue{fill:#2F6BFF}.purple{fill:#8A4FFF}
      .white{fill:#FFFFFF}.muted{fill:#526074}.line{stroke:#C9D5E5;stroke-width:4;fill:none}.dash{stroke-dasharray:10 8}
    </style>
    <text x="52" y="67" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:32px;font-weight:700">自主分析，受控执行</text><text x="52" y="105" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">建议可并行，高风险动作必须通过人工闸门</text>
    <rect x="52" y="160" width="330" height="105" rx="18" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/><text x="78" y="207" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:22px;font-weight:600">并行研判</text><text x="78" y="240" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">根因 / 影响 / 重评计划</text>
    <rect x="475" y="160" width="330" height="105" rx="18" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/><text x="501" y="207" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:22px;font-weight:600">证据冲突</text><text x="501" y="240" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">置信度不足则回退调查</text>
    <rect x="898" y="160" width="330" height="105" rx="18" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/><text x="924" y="207" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:22px;font-weight:600">批准执行</text><text x="924" y="240" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">单人按角色上下文确认</text>
    <path d="M382 212 H475 M805 212 H898" stroke="#C9D5E5" stroke-width="4" fill="none"/>
    <rect x="52" y="330" width="1176" height="230" rx="22" fill="#0B1F3A"/>
    <text x="86" y="378" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:22px;font-weight:600">三道安全闸门</text>
    <circle cx="117" cy="435" r="24" fill="#FF6B35"/><text x="108" y="443" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:22px;font-weight:600">1</text><text x="160" y="442" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:19px">控制组：确认修复不会改变健康提交</text>
    <circle cx="117" cy="490" r="24" fill="#2F6BFF"/><text x="108" y="498" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:22px;font-weight:600">2</text><text x="160" y="497" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:19px">灰度批次：比较错误率、耗时与成绩漂移</text>
    <circle cx="700" cy="435" r="24" fill="#0AA37F"/><text x="691" y="443" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:22px;font-weight:600">3</text><text x="743" y="442" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:19px">全量重评：幂等执行，批次状态可恢复</text>
    <text x="743" y="497" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:19px">关闭条件：覆盖 100%，重/漏/越界均为 0</text></svg>