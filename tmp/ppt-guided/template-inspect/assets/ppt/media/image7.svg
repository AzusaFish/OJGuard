    <text x="54" y="70" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:32px;font-weight:700">真实 Java Runner 对照证据</text><text x="54" y="108" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">同一提交、同一限制，仅运行时镜像不同</text>
    <rect x="54" y="158" width="535" height="340" rx="22" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/><rect x="54" y="158" width="535" height="72" rx="22" fill="#0AA37F"/><text x="82" y="204" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:22px;font-weight:600">normal-17</text><text x="82" y="282" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:32px;font-weight:700">3 / 3 OK</text><text x="82" y="334" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:19px">39 ms · 45 ms · 61 ms</text><text x="82" y="392" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">所有样例均在 80 ms 限制内</text><text x="82" y="442" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">Runner 结果已固化至证据文件</text>
    <rect x="641" y="158" width="535" height="340" rx="22" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/><rect x="641" y="158" width="535" height="72" rx="22" fill="#FF6B35"/><text x="669" y="204" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:22px;font-weight:600">degraded-17</text><text x="669" y="282" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:32px;font-weight:700">3 / 3 TLE</text><text x="669" y="334" style="font-family:Microsoft YaHei,sans-serif;fill:#1B1F3B;font-size:19px">92 ms · 91 ms · 83 ms</text><text x="669" y="392" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">同一限制下稳定超时</text><text x="669" y="442" style="font-family:Microsoft YaHei,sans-serif;fill:#526074;font-size:16px">镜像与结果均带 SHA-256</text>
    <rect x="54" y="548" width="1122" height="76" rx="18" fill="#0B1F3A"/><text x="84" y="596" style="font-family:Microsoft YaHei,sans-serif;fill:#FFFFFF;font-size:19px">结论：运行时退化与错误结果存在可复核因果证据，重评范围由事实筛选而非模型猜测。</text></svg>